services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    volumes:
      - shared_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      retries: 20

  db_whale:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    volumes:
      - whale_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      TENANT_DSN_MAP: '{"1": "postgresql://erp:erp@db_whale:5432/erp"}'
      POOL_MAX: "10"
    expose: ["8000"]
    depends_on:
      db: { condition: service_healthy }
      db_whale: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 1g }

  api_whale:
    build: .
    environment:
      DATABASE_URL: postgresql://erp:erp@db_whale:5432/erp
      POOL_MAX: "20"
      SIM_API_URL: http://127.0.0.1:8000
    expose: ["8000"]
    depends_on:
      db_whale: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "4", memory: 2g }

  gateway:
    image: nginx:1.27-alpine
    ports: ["8000:80"]
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, api_whale]
    restart: unless-stopped

volumes:
  shared_pgdata:
  whale_pgdata:
