resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Enterprise tenant receives a separate API process and resource limits.
    location ~ ^/t/1(?:/|$) {
        set $enterprise_api http://api_whale:8000;
        proxy_pass $enterprise_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # All existing small tenants and shared operations endpoints.
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
